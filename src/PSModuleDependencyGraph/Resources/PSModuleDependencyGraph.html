<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* Colours and type are set from the config when the page loads; these are
   only what shows for the instant before. */
:root {
    --bg: #12161c;
    --panel: #1a1f27;
    --panel-2: #222834;
    --line: #2e3644;
    --fg: #e6edf6;
    --fg-dim: #98a4b6;
    --accent: #4da3ff;
    --font: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-size: 13px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font: var(--font-size)/1.5 var(--font);
}

#app { display: flex; flex-direction: column; height: 100%; }

header {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
}
header h1 { margin: 0; font-size: 15px; font-weight: 600; }
header .version { color: var(--fg-dim); font-size: 12px; }
header .counts { margin-left: auto; display: flex; flex-wrap: wrap; gap: 14px; color: var(--fg-dim); font-size: 12px; }
header .counts b { color: var(--fg); font-weight: 600; }

#main { flex: 1 1 auto; display: flex; min-height: 0; }

#sidebar {
    flex: 0 0 320px;
    width: 320px;
    overflow-y: auto;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 12px;
}

.section { margin-bottom: 18px; }
.section h2 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--fg-dim);
}

input[type=search], select {
    width: 100%;
    padding: 6px 8px;
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 4px;
    font: inherit;
}
input[type=search]:focus, select:focus { outline: 1px solid var(--accent); }

.buttons { display: flex; gap: 6px; margin-top: 8px; }
button {
    flex: 1 1 auto;
    padding: 5px 8px;
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 4px;
    font: inherit;
    cursor: pointer;
}
button:hover { border-color: var(--accent); }

/* One row per node type and per module: box, swatch, name, count. */
.toggle-row { display: flex; align-items: center; gap: 7px; margin-top: 5px; }
.toggle-row input { margin: 0; }
.toggle-row .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toggle-row .name.link { cursor: pointer; }
.toggle-row .name.link:hover { color: var(--accent); }
.toggle-row .count { color: var(--fg-dim); font-size: 12px; }
.toggle-row .tag { font-size: 11px; color: #ff9f7f; border: 1px solid #ff9f7f55; border-radius: 3px; padding: 0 4px; }
.swatch { flex: 0 0 14px; width: 14px; height: 10px; border-radius: 2px; }
.swatch.line { height: 0; border-top: 2px solid; border-radius: 0; }
.swatch.dashed { border-top-style: dashed; }
.edge-legend { display: grid; grid-template-columns: 14px 1fr; gap: 6px 8px; align-items: center; margin-top: 10px; }

.hint { margin: 0 0 6px; color: var(--fg-dim); }
.warn { color: #f2c14e; }

ul.links { margin: 0; padding: 0; list-style: none; }
a.node-link { color: var(--accent); cursor: pointer; text-decoration: none; }
a.node-link:hover { text-decoration: underline; }

dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
dt { color: var(--fg-dim); }
dd { margin: 0; word-break: break-word; }
.set-name { font-weight: 600; }
.set-params { color: var(--fg-dim); margin-bottom: 4px; }

#canvas-wrap { flex: 1 1 auto; position: relative; min-width: 0; overflow: hidden; }
#graph { position: absolute; inset: 0; }

#loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    transition: opacity .4s;
    z-index: 5;
}
#loading .bar-outer { width: 320px; }
#loading .bar-text { text-align: center; color: var(--fg-dim); margin-bottom: 6px; }
#loading .bar-track { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
#loading .bar-fill { height: 100%; width: 35%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }

#node-menu {
    position: fixed;
    z-index: 20;
    min-width: 200px;
    padding: 4px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .45);
}
#node-menu .menu-title {
    padding: 4px 10px 6px;
    color: var(--fg-dim);
    font-size: 12px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 4px;
}
#node-menu button {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    padding: 6px 10px;
}
#node-menu button:hover:not(:disabled) { background: var(--line); }
#node-menu button:disabled { color: var(--fg-dim); cursor: default; }

#toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 14px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    transition: opacity .3s;
    z-index: 30;
}

div.vis-tooltip {
    background: var(--panel-2) !important;
    color: var(--fg) !important;
    border: 1px solid var(--line) !important;
    font: 12px/1.4 var(--font) !important;
    white-space: pre-line;
}
</style>
</head>
<body>
<div id="app">
    <header>
        <h1 id="hdr-title">{{TITLE}}</h1>
        <span class="version" id="hdr-version"></span>
        <span class="counts" id="hdr-counts"></span>
    </header>
    <div id="main">
        <aside id="sidebar">
            <div class="section">
                <h2>Find</h2>
                <input type="search" id="search" placeholder="Name" autocomplete="off">
            </div>
            <div class="section">
                <h2>Show</h2>
                <div id="type-toggles"></div>
                <div class="edge-legend" id="edge-legend"></div>
            </div>
            <div class="section" id="modules-section" hidden>
                <h2>Modules</h2>
                <p class="hint">Modules this code depends on. Untick one to hide its commands; click its name to select them and their callers.</p>
                <div id="module-toggles"></div>
            </div>
            <div class="section">
                <h2>Layout</h2>
                <select id="direction">
                    <option value="LeftToRight">Left to right</option>
                    <option value="TopToBottom">Top to bottom</option>
                </select>
                <div class="buttons">
                    <button type="button" id="fit">Fit</button>
                    <button type="button" id="relayout">Re-layout</button>
                </div>
            </div>
            <div class="section">
                <h2>Details</h2>
                <p class="hint" id="details-empty">Click a node. Right-click for more.</p>
                <dl id="details" hidden></dl>
            </div>
        </aside>
        <div id="canvas-wrap">
            <div id="graph"></div>
            <div id="loading">
                <div class="bar-outer">
                    <div class="bar-text">Laying out the graph</div>
                    <div class="bar-track"><div class="bar-fill"></div></div>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="node-menu" role="menu" hidden></div>
<div id="toast" hidden></div>

<script type="application/json" id="graph-data">/*{{GRAPH_DATA}}*/</script>
<script type="application/json" id="graph-config">/*{{GRAPH_CONFIG}}*/</script>
<script>/*{{VIS_NETWORK}}*/</script>
<script>
(function () {
    'use strict';

    const data = JSON.parse(document.getElementById('graph-data').textContent);
    const config = JSON.parse(document.getElementById('graph-config').textContent);
    const meta = data.meta;
    const NO_MODULE = '(no module found)';

    // ---- Theme ------------------------------------------------------------
    const theme = config.Theme;
    const rootStyle = document.documentElement.style;
    for (const [cssVar, key] of [['--bg', 'Background'], ['--panel', 'Panel'], ['--panel-2', 'PanelAlt'],
        ['--line', 'Border'], ['--fg', 'Text'], ['--fg-dim', 'TextDim'], ['--accent', 'Accent']]) {
        rootStyle.setProperty(cssVar, theme[key]);
    }
    rootStyle.setProperty('--font', theme.FontFamily);
    rootStyle.setProperty('--font-size', theme.FontSize + 'px');

    // Solid fills mixed from a colour and the page background. A translucent
    // fill lets edges show through a box and strike out its label.
    function mix(hex, amount) {
        const parse = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
        const a = parse(hex), b = parse(theme.Background);
        return '#' + a.map((v, i) => Math.round(v * amount + b[i] * (1 - amount))
            .toString(16).padStart(2, '0')).join('');
    }
    const escapeHtml = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // ---- Groups: how each node Type is drawn, from the config -----------------
    const fill = config.Nodes.FillStrength;
    const groupByName = Object.fromEntries(config.NodeGroups.map(g => [g.Name, g]));
    const visGroups = {};
    for (const g of config.NodeGroups) {
        visGroups[g.Name] = {
            shape: g.Shape || 'box',
            color: {
                background: mix(g.Color, fill),
                border: g.Color,
                highlight: { background: mix(g.Color, Math.min(1, fill * 2)), border: g.Color },
                hover: { background: mix(g.Color, Math.min(1, fill * 1.6)), border: g.Color }
            },
            shapeProperties: { borderDashes: g.Dashed ? [4, 3] : false }
        };
    }

    // ---- Data -------------------------------------------------------------
    const lines = n => n.startLine ? (n.endLine && n.endLine !== n.startLine ? n.startLine + '-' + n.endLine : String(n.startLine)) : '';
    const moduleOf = n => n.kind === 'Command' ? (n.moduleName || NO_MODULE) : null;
    const nodes = new vis.DataSet(data.nodes.map(n => {
        const node = {
            id: n.id,
            label: n.label,
            group: n.group,
            title: [n.label, n.type + (n.kind === 'Function' ? (n.cmdletBinding ? ' (CmdletBinding)' : ' (no CmdletBinding)') : ''),
                n.path ? n.path + ':' + lines(n) : null,
                n.kind === 'Command' ? (n.moduleName || '') + (n.moduleVersion ? ' ' + n.moduleVersion : '') : null,
                n.synopsis].filter(Boolean).join('\n'),
            raw: n
        };
        // External commands carry their module under the name; one not found
        // on this machine is dashed.
        if (n.kind === 'Command') {
            const second = n.found ? (n.moduleName || n.commandType || '') : (n.moduleName ? n.moduleName + ', ' : '') + config.Nodes.NotFoundText;
            node.label = escapeHtml(n.label) + (second ? '\n<i>' + escapeHtml(second) + '</i>' : '');
            node.font = { multi: 'html', ital: { color: theme.TextDim, size: Math.max(9, theme.FontSize - 2) } };
            if (!n.found) { node.shapeProperties = { borderDashes: [4, 3] }; }
        }
        return node;
    }));

    const edgeStyle = e => {
        if (e.resolution === 'Ambiguous') { return { color: config.Edges.AmbiguousColor, dashes: true }; }
        if (e.resolution === 'External') { return { color: config.Edges.ExternalColor, dashes: true }; }
        if (e.kind === 'Inherits') { return { color: config.Edges.InheritsColor, dashes: false }; }
        if (e.kind === 'Outputs') { return { color: config.Edges.OutputsColor, dashes: e.isDeclared ? false : [2, 4] }; }
        return { color: null, dashes: false };
    };
    const edges = new vis.DataSet(data.edges.map((e, i) => {
        const style = edgeStyle(e);
        return {
            id: 'e' + i,
            from: e.from,
            to: e.to,
            dashes: style.dashes,
            color: style.color ? { color: style.color, highlight: style.color, hover: style.color } : undefined,
            arrows: { to: { enabled: true, scaleFactor: config.Edges.ArrowScale, type: e.kind === 'Inherits' ? 'triangle' : (e.kind === 'Outputs' ? 'diamond' : 'arrow') } },
            title: e.kind === 'Inherits' ? 'inherits'
                : e.kind === 'Outputs' ? (e.isDeclared ? 'outputs (declared in [OutputType()])' : 'outputs, not declared in [OutputType()]')
                : e.resolution === 'External' ? 'calls a command from outside the module'
                : e.resolution === 'Ambiguous' ? 'calls (ambiguous: ' + e.candidates + ' definitions share this name)'
                : 'calls',
            raw: e
        };
    }));

    // What is visible: node types and, for external commands, their modules.
    const shownTypes = new Set(config.Show.Types);
    const hiddenModules = new Set();
    const nodeView = new vis.DataView(nodes, {
        filter: n => shownTypes.has(n.group) && !(n.raw.kind === 'Command' && hiddenModules.has(moduleOf(n.raw)))
    });
    const edgeView = new vis.DataView(edges);

    // ---- Layout -----------------------------------------------------------
    // The layered layout places every node itself, callers before callees, so
    // physics is off: the picture is the same on every open and does not drift.
    function layoutOptions(direction) {
        const horizontal = direction === 'LeftToRight';
        const spacing = config.Layout[direction];
        return {
            layout: {
                hierarchical: {
                    enabled: true,
                    direction: horizontal ? 'LR' : 'UD',
                    sortMethod: config.Layout.SortMethod,
                    shakeTowards: 'roots',
                    levelSeparation: spacing.LevelSeparation,
                    nodeSpacing: spacing.NodeSpacing,
                    treeSpacing: spacing.TreeSpacing,
                    blockShifting: true,
                    edgeMinimization: true,
                    parentCentralization: true
                }
            },
            edges: {
                smooth: {
                    enabled: true,
                    type: config.Edges.Curve,
                    forceDirection: horizontal ? 'horizontal' : 'vertical',
                    roundness: config.Edges.Roundness
                }
            },
            physics: { enabled: false }
        };
    }

    const initial = layoutOptions(config.Layout.Direction);
    const options = {
        autoResize: true,
        groups: visGroups,
        layout: initial.layout,
        physics: initial.physics,
        nodes: {
            margin: { top: config.Nodes.PaddingY, right: config.Nodes.PaddingX, bottom: config.Nodes.PaddingY, left: config.Nodes.PaddingX },
            widthConstraint: { maximum: config.Nodes.MaxWidth },
            borderWidth: config.Nodes.BorderWidth,
            font: { color: theme.Text, face: theme.FontFamily, size: theme.FontSize }
        },
        edges: {
            width: config.Edges.Width,
            color: { color: config.Edges.Color, highlight: theme.Accent, hover: theme.Accent, inherit: false },
            selectionWidth: 1.5,
            smooth: initial.edges.smooth
        },
        interaction: { hover: true, tooltipDelay: 150, navigationButtons: false, keyboard: false }
    };

    const container = document.getElementById('graph');
    const network = new vis.Network(container, { nodes: nodeView, edges: edgeView }, options);

    // For the browser console: the network, its data, and what the page was built from.
    window.PSModuleDependencyGraph = { network, nodes, edges, data, config };

    const loading = document.getElementById('loading');
    function showLoading() {
        loading.style.display = 'flex';
        loading.style.opacity = 1;
    }
    function hideLoading() {
        loading.style.opacity = 0;
        setTimeout(() => { loading.style.display = 'none'; }, 400);
    }

    // Fit the whole graph, but never zoom a small one up past 1.2x.
    function fitAll(animate) {
        network.fit({ animation: animate ? { duration: 300 } : false });
        if (network.getScale() > 1.2) {
            network.moveTo({ scale: 1.2, animation: animate ? { duration: 300 } : false });
        }
    }
    network.once('afterDrawing', () => {
        fitAll(false);
        hideLoading();
    });

    const directionSelect = document.getElementById('direction');
    directionSelect.value = config.Layout.Direction;
    function relayout() {
        showLoading();
        network.setOptions(layoutOptions(directionSelect.value));
        requestAnimationFrame(() => {
            fitAll(true);
            hideLoading();
        });
    }
    function refreshView() {
        nodeView.refresh();
        edgeView.refresh();
        relayout();
    }
    function selectNodes(ids) {
        const visible = ids.filter(id => nodeView.get(id));
        network.selectNodes(visible);
        if (visible.length) { network.fit({ nodes: visible, animation: { duration: 300 } }); }
    }

    // ---- Header -----------------------------------------------------------
    const countOf = group => data.nodes.filter(n => n.group === group).length;
    const counts = document.getElementById('hdr-counts');
    document.getElementById('hdr-version').textContent = meta.version ? 'v' + meta.version : '';
    for (const [text, value] of [
        ['public', countOf('public')], ['private', countOf('private')], ['unresolved', countOf('unresolved')],
        ['external', countOf('external')], ['modules', data.modules.length]]) {
        const span = document.createElement('span');
        const b = document.createElement('b');
        b.textContent = value;
        span.append(b, ' ' + text);
        counts.append(span);
    }

    // ---- Show: one box per node Type ---------------------------------------
    function toggleRow(parent, { checked, swatchStyle, name, count, tag, onToggle, onName }) {
        const row = document.createElement('label');
        row.className = 'toggle-row';
        const box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = checked;
        box.addEventListener('change', () => onToggle(box.checked));
        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        Object.assign(swatch.style, swatchStyle);
        const label = document.createElement('span');
        label.className = 'name' + (onName ? ' link' : '');
        label.textContent = name;
        label.title = name;
        if (onName) {
            label.addEventListener('click', ev => { ev.preventDefault(); onName(); });
        }
        const n = document.createElement('span');
        n.className = 'count';
        n.textContent = count;
        row.append(box, swatch, label);
        if (tag) {
            const t = document.createElement('span');
            t.className = 'tag';
            t.textContent = tag;
            row.append(t);
        }
        row.append(n);
        parent.append(row);
    }

    const typeToggles = document.getElementById('type-toggles');
    for (const g of config.NodeGroups) {
        const count = countOf(g.Name);
        if (!count) { continue; }
        toggleRow(typeToggles, {
            checked: shownTypes.has(g.Name),
            swatchStyle: { background: mix(g.Color, Math.min(1, fill * 1.6)), border: '1px ' + (g.Dashed ? 'dashed ' : 'solid ') + g.Color },
            name: g.Label || g.Name,
            count,
            onToggle: on => { if (on) { shownTypes.add(g.Name); } else { shownTypes.delete(g.Name); } refreshView(); },
            onName: () => selectNodes(data.nodes.filter(n => n.group === g.Name).map(n => n.id))
        });
    }

    const edgeLegend = document.getElementById('edge-legend');
    function edgeRow(color, dashed, text) {
        const s = document.createElement('span');
        s.className = 'swatch line' + (dashed ? ' dashed' : '');
        s.style.borderTopColor = color;
        const t = document.createElement('span');
        t.textContent = text;
        edgeLegend.append(s, t);
    }
    edgeRow(config.Edges.Color, false, 'Calls');
    if (data.edges.some(e => e.resolution === 'External')) { edgeRow(config.Edges.ExternalColor, true, 'Calls an external command'); }
    if (data.edges.some(e => e.resolution === 'Ambiguous')) { edgeRow(config.Edges.AmbiguousColor, true, 'Ambiguous call'); }
    if (data.edges.some(e => e.kind === 'Outputs' && e.isDeclared)) { edgeRow(config.Edges.OutputsColor, false, 'Outputs (declared)'); }
    if (data.edges.some(e => e.kind === 'Outputs' && !e.isDeclared)) { edgeRow(config.Edges.OutputsColor, true, 'Outputs, not in [OutputType()]'); }
    if (data.edges.some(e => e.kind === 'Inherits')) { edgeRow(config.Edges.InheritsColor, false, 'Inherits'); }

    // ---- Modules: what the code depends on ----------------------------------
    const commandsByModule = new Map();
    for (const n of data.nodes.filter(x => x.kind === 'Command')) {
        const key = moduleOf(n);
        if (!commandsByModule.has(key)) { commandsByModule.set(key, []); }
        commandsByModule.get(key).push(n);
    }
    const moduleRows = data.modules.map(m => ({ name: m.name, version: m.version, installed: m.installed, declaredBy: m.declaredBy }));
    if (commandsByModule.has(NO_MODULE)) { moduleRows.push({ name: NO_MODULE, version: null, installed: false, declaredBy: [] }); }
    if (moduleRows.length) {
        const moduleToggles = document.getElementById('module-toggles');
        const externalColor = (groupByName.external || { Color: config.Edges.ExternalColor }).Color;
        for (const m of moduleRows) {
            const commands = commandsByModule.get(m.name) || [];
            const selectModule = () => {
                const ids = new Set();
                for (const c of commands) {
                    ids.add(c.id);
                    edges.get({ filter: e => e.to === c.id }).forEach(e => ids.add(e.from));
                }
                for (const caller of (data.modules.find(x => x.name === m.name) || { usedBy: [] }).usedBy) {
                    data.nodes.filter(n => n.name === caller && n.kind !== 'Command').forEach(n => ids.add(n.id));
                }
                selectNodes([...ids]);
            };
            toggleRow(moduleToggles, {
                checked: true,
                swatchStyle: { background: mix(externalColor, Math.min(1, fill * 1.6)), border: '1px ' + (m.installed ? 'solid ' : 'dashed ') + externalColor },
                name: m.name + (m.version ? ' ' + m.version : ''),
                count: commands.length,
                tag: m.name === NO_MODULE ? null : (m.installed ? null : 'not installed'),
                onToggle: on => { if (on) { hiddenModules.delete(m.name); } else { hiddenModules.add(m.name); } refreshView(); },
                onName: selectModule
            });
        }
        document.getElementById('modules-section').hidden = false;
    }

    // ---- Details panel ----------------------------------------------------
    const details = document.getElementById('details');
    const detailsEmpty = document.getElementById('details-empty');
    const nodeIdByName = new Map();
    for (const n of data.nodes) { if (!nodeIdByName.has(n.name)) { nodeIdByName.set(n.name, n.id); } }
    function nodeLink(id) {
        const n = nodes.get(id);
        const a = document.createElement('a');
        a.className = 'node-link';
        a.textContent = n ? n.raw.label : id;
        a.addEventListener('click', () => focusNode(id));
        return a;
    }
    function linkList(ids) {
        if (!ids.length) { return document.createTextNode('none'); }
        const ul = document.createElement('ul');
        ul.className = 'links';
        for (const id of ids) {
            const li = document.createElement('li');
            li.append(nodeLink(id));
            ul.append(li);
        }
        return ul;
    }
    const namesToLinks = names => linkList(names.map(name => nodeIdByName.get(name)).filter(Boolean));
    function row(term, value, cssClass) {
        const dt = document.createElement('dt');
        dt.textContent = term;
        const dd = document.createElement('dd');
        if (cssClass) { dd.className = cssClass; }
        if (value instanceof Node) { dd.append(value); } else { dd.textContent = value; }
        details.append(dt, dd);
    }
    function parameterSetBlock(sets) {
        const box = document.createElement('div');
        for (const set of sets) {
            const name = document.createElement('div');
            name.className = 'set-name';
            name.textContent = (set.name === '__AllParameterSets' ? '(all)' : set.name) + (set.isDefault ? ' (default)' : '');
            const params = document.createElement('div');
            params.className = 'set-params';
            params.textContent = set.parameters.length
                ? set.parameters.map(p => '-' + p.name + (p.mandatory ? '*' : '') + ' [' + p.type + ']').join(', ')
                : 'no parameters';
            box.append(name, params);
        }
        return box;
    }
    function showDetails(id) {
        const n = nodes.get(id);
        details.replaceChildren();
        if (!n) { details.hidden = true; detailsEmpty.hidden = false; return; }
        const r = n.raw;
        row('Name', r.name);
        row('Type', (groupByName[r.group] || {}).Label || r.type, r.group === 'unresolved' ? 'warn' : null);
        if (r.kind === 'Function') {
            row('CmdletBinding', r.cmdletBinding ? 'Yes (advanced function)' : 'No');
            row('Exported', r.exported ? 'Yes' : (r.exportState === 'NotApplicable' ? 'Not applicable (script)' : 'No'));
            row('Decided by', r.exportSource || '');
        }
        if (r.kind === 'Command') {
            row('Module', r.moduleName || 'none found');
            if (r.moduleVersion) { row('Version', r.moduleVersion); }
            if (r.commandType) { row('Command type', r.commandType + (r.resolvesTo ? ' for ' + r.resolvesTo : '')); }
            row('Found here', r.found ? 'Yes' : 'No', r.found ? null : 'warn');
        }
        if (r.path) { row('File', r.path); row('Lines', lines(r)); }
        if (r.synopsis) { row('Synopsis', r.synopsis); }
        if (r.kind === 'Function') {
            row('Parameter sets', parameterSetBlock(r.parameterSets));
            const short = r.exported && r.exampleCount < r.parameterSets.length;
            row('Examples', r.exampleCount + (short ? ' (fewer than its ' + r.parameterSets.length + ' parameter sets)' : ''), short ? 'warn' : null);
            row('[OutputType()]', r.outputType.length ? r.outputType.join(', ') : 'none');
            if (r.inferredOutputType.length) { row('Outputs', r.inferredOutputType.join(', ')); }
            if (r.undeclaredOutputType.length) { row('Not declared', r.undeclaredOutputType.join(', '), 'warn'); }
        }
        if (r.kind === 'Class' || r.kind === 'Enum') {
            row('Output by', namesToLinks(r.outputBy));
            if (r.undeclaredOutputBy.length) { row('Not declared by', namesToLinks(r.undeclaredOutputBy), 'warn'); }
        }
        const out = [...new Set(edges.get({ filter: e => e.from === id && e.raw.kind !== 'Outputs' }).map(e => e.to))];
        const internal = out.filter(t => nodes.get(t).raw.kind !== 'Command');
        const external = out.filter(t => nodes.get(t).raw.kind === 'Command');
        const inc = [...new Set(edges.get({ filter: e => e.to === id && e.from !== id }).map(e => e.from))];
        if (r.kind !== 'Command') { row('Calls', linkList(internal)); }
        if (external.length) { row('External', linkList(external)); }
        row(r.kind === 'Class' || r.kind === 'Enum' ? 'Used by' : 'Called by', linkList(inc));
        details.hidden = false;
        detailsEmpty.hidden = true;
    }
    function focusNode(id) {
        if (!nodeView.get(id)) { return; }
        network.selectNodes([id]);
        network.focus(id, { scale: Math.max(network.getScale(), 0.9), animation: { duration: 400 } });
        showDetails(id);
    }
    network.on('click', p => {
        hideMenu();
        if (p.nodes.length) { showDetails(p.nodes[0]); }
        else { details.hidden = true; detailsEmpty.hidden = false; }
    });

    // ---- Right-click menu -------------------------------------------------
    // Built from config.NodeMenu, a list: each entry is a label, an action
    // (Open a link or Copy text) and a target with {placeholders}.
    const menu = document.getElementById('node-menu');
    const toast = document.getElementById('toast');
    let toastTimer;
    function showToast(text) {
        toast.textContent = text;
        toast.hidden = false;
        toast.style.opacity = 1;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.style.opacity = 0; setTimeout(() => { toast.hidden = true; }, 300); }, 1400);
    }
    function placeholders(r) {
        const full = r.path ? meta.rootPath.replace(/[\\/]+$/, '') + meta.separator + r.path : '';
        const urlPath = encodeURI(full.replace(/\\/g, '/').replace(/^\/+/, ''))
            .replace(/#/g, '%23').replace(/\?/g, '%3F');
        return {
            name: r.name || '',
            module: r.moduleName || '',
            path: r.path || '',
            fullPath: full,
            fileUrlPath: urlPath,
            startLine: r.startLine || 1,
            endLine: r.endLine || r.startLine || 1
        };
    }
    const fillTemplate = (template, values) => template.replace(/\{(\w+)\}/g, (m, key) => key in values ? values[key] : m);
    async function copyText(text) {
        try {
            await navigator.clipboard.writeText(text);
        } catch {
            const area = document.createElement('textarea');
            area.value = text;
            document.body.append(area);
            area.select();
            document.execCommand('copy');
            area.remove();
        }
        showToast('Copied ' + text);
    }
    function runMenuItem(item, r) {
        const target = fillTemplate(item.Target, placeholders(r));
        if (item.Action === 'Copy') {
            copyText(target);
        } else {
            const a = document.createElement('a');
            a.href = target;
            a.rel = 'noopener';
            document.body.append(a);
            a.click();
            a.remove();
        }
    }
    const menuItemEnabled = (item, r) =>
        item.When === 'HasFile' ? !!r.path : item.When === 'HasModule' ? !!r.moduleName : true;
    function hideMenu() { menu.hidden = true; }
    function showMenu(id, x, y) {
        const r = nodes.get(id).raw;
        menu.replaceChildren();
        const title = document.createElement('div');
        title.className = 'menu-title';
        title.textContent = r.name;
        menu.append(title);
        for (const item of config.NodeMenu) {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = item.Label;
            button.disabled = !menuItemEnabled(item, r);
            button.addEventListener('click', () => { hideMenu(); runMenuItem(item, r); });
            menu.append(button);
        }
        menu.hidden = false;
        const box = menu.getBoundingClientRect();
        menu.style.left = Math.min(x, window.innerWidth - box.width - 4) + 'px';
        menu.style.top = Math.min(y, window.innerHeight - box.height - 4) + 'px';
    }
    container.addEventListener('contextmenu', ev => ev.preventDefault());
    network.on('oncontext', p => {
        const id = network.getNodeAt(p.pointer.DOM);
        if (id === undefined) { hideMenu(); return; }
        network.selectNodes([id]);
        showDetails(id);
        const rect = container.getBoundingClientRect();
        showMenu(id, rect.left + p.pointer.DOM.x, rect.top + p.pointer.DOM.y);
    });
    document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { hideMenu(); } });
    document.addEventListener('mousedown', ev => { if (!menu.contains(ev.target)) { hideMenu(); } });
    network.on('dragStart', hideMenu);
    network.on('zoom', hideMenu);

    // ---- Search and layout controls ---------------------------------------
    document.getElementById('search').addEventListener('input', ev => {
        const q = ev.target.value.trim().toLowerCase();
        if (!q) { network.unselectAll(); return; }
        const hits = nodeView.getIds({ filter: n => n.raw.label.toLowerCase().includes(q) });
        network.selectNodes(hits);
        if (hits.length) { network.fit({ nodes: hits, animation: { duration: 300 } }); }
        if (hits.length === 1) { showDetails(hits[0]); }
    });
    directionSelect.addEventListener('change', relayout);
    document.getElementById('fit').addEventListener('click', () => fitAll(true));
    document.getElementById('relayout').addEventListener('click', relayout);
})();
</script>
</body>
</html>
