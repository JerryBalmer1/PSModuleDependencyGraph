<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
    --bg: #12161c;
    --panel: #1a1f27;
    --panel-2: #222834;
    --line: #2e3644;
    --fg: #e6edf6;
    --fg-dim: #98a4b6;
    --accent: #4da3ff;
    --exported: #4da3ff;
    --internal: #7f8ea3;
    --script: #9b8cff;
    --class: #f2c14e;
    --enum: #6ddf6d;
    --external: #ff7043;
    --ambiguous: #f2c14e;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.5 "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
}

#app { display: flex; flex-direction: column; height: 100%; }

header {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
}
header h1 { margin: 0; font-size: 15px; font-weight: 600; }
header .version { color: var(--fg-dim); font-size: 12px; }
header .counts { margin-left: auto; display: flex; gap: 14px; color: var(--fg-dim); font-size: 12px; }
header .counts b { color: var(--fg); font-weight: 600; }

#main { flex: 1 1 auto; display: flex; min-height: 0; }

#sidebar {
    flex: 0 0 300px;
    width: 300px;
    overflow-y: auto;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 12px;
}

.section { margin-bottom: 18px; }
.section h2 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--fg-dim);
}

input[type=search], select {
    width: 100%;
    padding: 6px 8px;
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 4px;
    font: inherit;
}
input[type=search]:focus, select:focus { outline: 1px solid var(--accent); }

label.check { display: flex; align-items: center; gap: 6px; margin-top: 6px; cursor: pointer; }

.buttons { display: flex; gap: 6px; margin-top: 8px; }
button {
    flex: 1 1 auto;
    padding: 5px 8px;
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 4px;
    font: inherit;
    cursor: pointer;
}
button:hover { border-color: var(--accent); }

.legend { display: grid; grid-template-columns: 14px 1fr; gap: 6px 8px; align-items: center; }
.swatch { width: 14px; height: 10px; border-radius: 2px; }
.swatch.line { height: 0; border-top: 2px solid; border-radius: 0; }
.swatch.dashed { border-top-style: dashed; }

.hint { margin: 0; color: var(--fg-dim); }

dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
dt { color: var(--fg-dim); }
dd { margin: 0; word-break: break-word; }
dd ul { margin: 0; padding: 0; list-style: none; }
dd a { color: var(--accent); cursor: pointer; text-decoration: none; }
dd a:hover { text-decoration: underline; }

#canvas-wrap { flex: 1 1 auto; position: relative; min-width: 0; overflow: hidden; }
#graph { position: absolute; inset: 0; }

#loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    transition: opacity .4s;
    z-index: 5;
}
#loading .bar-outer { width: 320px; }
#loading .bar-text { text-align: center; color: var(--fg-dim); margin-bottom: 6px; }
#loading .bar-track { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
#loading .bar-fill { height: 100%; width: 35%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }

div.vis-tooltip {
    background: var(--panel-2) !important;
    color: var(--fg) !important;
    border: 1px solid var(--line) !important;
    font: 12px/1.4 "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
    white-space: pre-line;
}
</style>
</head>
<body>
<div id="app">
    <header>
        <h1 id="hdr-title">{{TITLE}}</h1>
        <span class="version" id="hdr-version"></span>
        <span class="counts">
            <span><b id="c-functions">0</b> functions</span>
            <span><b id="c-edges">0</b> calls</span>
            <span><b id="c-unresolved">0</b> unresolved</span>
        </span>
    </header>
    <div id="main">
        <aside id="sidebar">
            <div class="section">
                <h2>Find</h2>
                <input type="search" id="search" placeholder="Function name" autocomplete="off">
            </div>
            <div class="section">
                <h2>Show</h2>
                <label class="check"><input type="checkbox" id="exported-only"> Exported only</label>
                <label class="check" id="unresolved-wrap" hidden><input type="checkbox" id="show-unresolved"> Unresolved commands</label>
            </div>
            <div class="section">
                <h2>Layout</h2>
                <select id="direction">
                    <option value="LR">Left to right</option>
                    <option value="UD">Top to bottom</option>
                </select>
                <div class="buttons">
                    <button type="button" id="fit">Fit</button>
                    <button type="button" id="relayout">Re-layout</button>
                </div>
            </div>
            <div class="section">
                <h2>Legend</h2>
                <div class="legend" id="legend"></div>
            </div>
            <div class="section">
                <h2>Details</h2>
                <p class="hint" id="details-empty">Click a node.</p>
                <dl id="details" hidden></dl>
            </div>
        </aside>
        <div id="canvas-wrap">
            <div id="graph"></div>
            <div id="loading">
                <div class="bar-outer">
                    <div class="bar-text">Laying out the graph</div>
                    <div class="bar-track"><div class="bar-fill"></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="application/json" id="graph-data">/*{{GRAPH_DATA}}*/</script>
<script>/*{{VIS_NETWORK}}*/</script>
<script>
(function () {
    'use strict';

    const data = JSON.parse(document.getElementById('graph-data').textContent);
    const css = getComputedStyle(document.documentElement);
    const color = name => css.getPropertyValue('--' + name).trim();

    // Solid fills mixed from the group colour and the page background. A
    // translucent fill lets edges show through a box and strike out its label.
    function mix(hex, amount) {
        const parse = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
        const a = parse(hex), b = parse(color('bg'));
        return '#' + a.map((v, i) => Math.round(v * amount + b[i] * (1 - amount))
            .toString(16).padStart(2, '0')).join('');
    }

    // One entry per node group: how it is drawn and what the legend calls it.
    const groups = {
        exported: { label: 'Exported function', color: color('exported'), shape: 'box' },
        internal: { label: 'Not exported', color: color('internal'), shape: 'box' },
        script:   { label: 'Script top level', color: color('script'), shape: 'ellipse' },
        class:    { label: 'Class', color: color('class'), shape: 'box' },
        enum:     { label: 'Enum', color: color('enum'), shape: 'box' },
        external: { label: 'Unresolved command', color: color('external'), shape: 'box', dashed: true }
    };

    const nodes = new vis.DataSet(data.nodes.map(n => ({
        id: n.id,
        label: n.label,
        group: n.group,
        title: [n.label, n.kindLabel, n.path ? n.path + (n.line ? ':' + n.line : '') : null]
            .filter(Boolean).join('\n'),
        raw: n
    })));

    const edges = new vis.DataSet(data.edges.map((e, i) => ({
        id: 'e' + i,
        from: e.from,
        to: e.to,
        dashes: e.resolution === 'Ambiguous',
        color: e.resolution === 'Ambiguous' ? { color: color('ambiguous') }
             : e.kind === 'Unresolved' ? { color: color('external') }
             : e.kind === 'Inherits' ? { color: color('class') }
             : undefined,
        arrows: { to: { enabled: true, scaleFactor: 0.6, type: e.kind === 'Inherits' ? 'triangle' : 'arrow' } },
        title: e.kind === 'Inherits' ? 'inherits' : (e.resolution === 'Ambiguous'
            ? 'calls (ambiguous: ' + e.candidates + ' definitions share this name)' : 'calls'),
        raw: e
    })));

    const filters = { exportedOnly: false, showUnresolved: false };
    const nodeView = new vis.DataView(nodes, {
        filter: n => {
            if (n.group === 'external') { return filters.showUnresolved; }
            if (filters.exportedOnly && n.raw.kind === 'Function' && !n.raw.exported) { return false; }
            return true;
        }
    });
    const edgeView = new vis.DataView(edges, {
        filter: e => e.raw.kind !== 'Unresolved' || filters.showUnresolved
    });

    const visGroups = {};
    for (const [key, g] of Object.entries(groups)) {
        visGroups[key] = {
            shape: g.shape,
            color: {
                background: mix(g.color, 0.2),
                border: g.color,
                highlight: { background: mix(g.color, 0.4), border: g.color },
                hover: { background: mix(g.color, 0.32), border: g.color }
            },
            shapeProperties: { borderDashes: g.dashed ? [4, 3] : false }
        };
    }

    // The layered layout places every node itself, callers before callees, so
    // physics is off: the picture is the same on every open and does not drift.
    function layoutOptions(direction) {
        const horizontal = direction === 'LR';
        return {
            layout: {
                hierarchical: {
                    enabled: true,
                    direction: direction,
                    sortMethod: 'directed',
                    shakeTowards: 'roots',
                    levelSeparation: horizontal ? 330 : 110,
                    nodeSpacing: horizontal ? 50 : 300,
                    treeSpacing: horizontal ? 70 : 260,
                    blockShifting: true,
                    edgeMinimization: true,
                    parentCentralization: true
                }
            },
            edges: {
                smooth: {
                    enabled: true,
                    type: 'cubicBezier',
                    forceDirection: horizontal ? 'horizontal' : 'vertical',
                    roundness: 0.45
                }
            },
            physics: { enabled: false }
        };
    }

    const options = {
        autoResize: true,
        groups: visGroups,
        nodes: {
            margin: { top: 7, right: 10, bottom: 7, left: 10 },
            widthConstraint: { maximum: 280 },
            borderWidth: 1.5,
            font: { color: color('fg'), face: 'Segoe UI, Roboto, Helvetica, Arial, sans-serif', size: 13 }
        },
        edges: {
            width: 1.2,
            color: { color: '#5d6b80', highlight: color('accent'), hover: color('accent'), inherit: false },
            selectionWidth: 1.5
        },
        interaction: { hover: true, tooltipDelay: 150, navigationButtons: false, keyboard: false }
    };

    const base = layoutOptions('LR');
    options.layout = base.layout;
    options.physics = base.physics;
    options.edges.smooth = base.edges.smooth;

    const network = new vis.Network(document.getElementById('graph'), { nodes: nodeView, edges: edgeView }, options);

    // Shown until the first frame is drawn: laying out a large module takes a
    // moment, and a blank canvas reads as a broken page.
    const loading = document.getElementById('loading');
    function showLoading() {
        loading.style.display = 'flex';
        loading.style.opacity = 1;
    }
    function hideLoading() {
        loading.style.opacity = 0;
        setTimeout(() => { loading.style.display = 'none'; }, 400);
    }

    // Fit the whole graph, but never zoom a small one up past 1.2x.
    function fitAll(animate) {
        network.fit({ animation: animate ? { duration: 300 } : false });
        if (network.getScale() > 1.2) {
            network.moveTo({ scale: 1.2, animation: animate ? { duration: 300 } : false });
        }
    }
    network.once('afterDrawing', () => {
        fitAll(false);
        hideLoading();
    });

    function relayout(direction) {
        showLoading();
        network.setOptions(layoutOptions(direction));
        requestAnimationFrame(() => {
            fitAll(true);
            hideLoading();
        });
    }

    // Header
    const meta = data.meta;
    document.getElementById('hdr-version').textContent = meta.version ? 'v' + meta.version : '';
    document.getElementById('c-functions').textContent = meta.stats.FunctionCount;
    document.getElementById('c-edges').textContent = data.edges.filter(e => e.kind !== 'Unresolved').length;
    document.getElementById('c-unresolved').textContent = meta.stats.UnresolvedCount;

    // Legend
    const legend = document.getElementById('legend');
    const present = new Set(data.nodes.map(n => n.group));
    function legendRow(swatchClass, style, text) {
        const s = document.createElement('span');
        s.className = swatchClass;
        Object.assign(s.style, style);
        const t = document.createElement('span');
        t.textContent = text;
        legend.append(s, t);
    }
    for (const [key, g] of Object.entries(groups)) {
        if (key === 'external' && !data.hasUnresolved) { continue; }
        if (key !== 'external' && !present.has(key)) { continue; }
        legendRow('swatch', { background: mix(g.color, 0.32), border: '1px ' + (g.dashed ? 'dashed ' : 'solid ') + g.color }, g.label);
    }
    legendRow('swatch line', { borderTopColor: '#5d6b80' }, 'Calls');
    if (data.edges.some(e => e.resolution === 'Ambiguous')) {
        legendRow('swatch line dashed', { borderTopColor: color('ambiguous') }, 'Ambiguous call');
    }
    if (data.edges.some(e => e.kind === 'Inherits')) {
        legendRow('swatch line', { borderTopColor: color('class') }, 'Inherits');
    }

    // Details panel
    const details = document.getElementById('details');
    const detailsEmpty = document.getElementById('details-empty');
    function focusNode(id) {
        network.selectNodes([id]);
        network.focus(id, { scale: 1.1, animation: { duration: 400 } });
        showDetails(id);
    }
    function nodeList(ids) {
        const ul = document.createElement('ul');
        for (const id of ids) {
            const n = nodes.get(id);
            if (!n) { continue; }
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.textContent = n.label;
            a.addEventListener('click', () => focusNode(id));
            li.append(a);
            ul.append(li);
        }
        return ul.childElementCount ? ul : document.createTextNode('none');
    }
    function row(term, value) {
        const dt = document.createElement('dt');
        dt.textContent = term;
        const dd = document.createElement('dd');
        if (value instanceof Node) { dd.append(value); } else { dd.textContent = value; }
        details.append(dt, dd);
    }
    function showDetails(id) {
        const n = nodes.get(id);
        details.replaceChildren();
        if (!n) { details.hidden = true; detailsEmpty.hidden = false; return; }
        const r = n.raw;
        row('Name', r.label);
        row('Kind', r.kindLabel);
        if (r.kind === 'Function') {
            row('Exported', r.exported ? 'Yes' : (r.exportState === 'NotApplicable' ? 'Not applicable (script)' : 'No'));
            row('Decided by', r.exportSource || '');
        }
        if (r.path) { row('File', r.path + (r.line ? ':' + r.line : '')); }
        const out = edges.get({ filter: e => e.from === id }).map(e => e.to);
        const inc = edges.get({ filter: e => e.to === id }).map(e => e.from);
        row('Calls', nodeList([...new Set(out)]));
        row('Called by', nodeList([...new Set(inc)]));
        details.hidden = false;
        detailsEmpty.hidden = true;
    }
    network.on('click', p => {
        if (p.nodes.length) { showDetails(p.nodes[0]); }
        else { details.hidden = true; detailsEmpty.hidden = false; }
    });

    // Search: select the matching nodes and fit them into view.
    document.getElementById('search').addEventListener('input', ev => {
        const q = ev.target.value.trim().toLowerCase();
        if (!q) { network.unselectAll(); return; }
        const hits = nodeView.getIds({ filter: n => n.label.toLowerCase().includes(q) });
        network.selectNodes(hits);
        if (hits.length) { network.fit({ nodes: hits, animation: { duration: 300 } }); }
        if (hits.length === 1) { showDetails(hits[0]); }
    });

    document.getElementById('exported-only').addEventListener('change', ev => {
        filters.exportedOnly = ev.target.checked;
        nodeView.refresh();
        edgeView.refresh();
    });
    if (data.hasUnresolved) {
        document.getElementById('unresolved-wrap').hidden = false;
        document.getElementById('show-unresolved').addEventListener('change', ev => {
            filters.showUnresolved = ev.target.checked;
            nodeView.refresh();
            edgeView.refresh();
            relayout(document.getElementById('direction').value);
        });
    }
    document.getElementById('direction').addEventListener('change', ev => relayout(ev.target.value));
    document.getElementById('fit').addEventListener('click', () => fitAll(true));
    document.getElementById('relayout').addEventListener('click', () => relayout(document.getElementById('direction').value));
})();
</script>
</body>
</html>
